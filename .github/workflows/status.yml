name: Implementation Status

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-swift:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run Swift tests
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          START_TIME=$(date +%s)
          swift test
          EXIT_CODE=$?
          END_TIME=$(date +%s)
          DURATION=$(( (END_TIME - START_TIME) * 1000 ))
          if [ "$EXIT_CODE" -eq 0 ]; then
            STATUS="passing"
            ERROR="null"
          else
            STATUS="failing"
            ERROR="\"Tests failed\""
          fi
          cat > "$GITHUB_WORKSPACE/swift-algochat.json" << EOF
          {
            "implementationId": "swift-algochat",
            "status": "$STATUS",
            "duration": $DURATION,
            "error": $ERROR,
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "$CANDIDATE_SHA"
          }
          EOF
          cat "$GITHUB_WORKSPACE/swift-algochat.json"
          exit "$EXIT_CODE"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-algochat-result
          path: swift-algochat.json
          if-no-files-found: error

  test-typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: ts
        run: bun install

      - name: Run TypeScript tests
        working-directory: ts
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          START_TIME=$(date +%s)
          bun test
          EXIT_CODE=$?
          END_TIME=$(date +%s)
          DURATION=$(( (END_TIME - START_TIME) * 1000 ))
          if [ "$EXIT_CODE" -eq 0 ]; then
            STATUS="passing"
            ERROR="null"
          else
            STATUS="failing"
            ERROR="\"Tests failed\""
          fi
          cat > "$GITHUB_WORKSPACE/ts-algochat.json" << EOF
          {
            "implementationId": "ts-algochat",
            "status": "$STATUS",
            "duration": $DURATION,
            "error": $ERROR,
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "$CANDIDATE_SHA"
          }
          EOF
          cat "$GITHUB_WORKSPACE/ts-algochat.json"
          exit "$EXIT_CODE"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ts-algochat-result
          path: ts-algochat.json
          if-no-files-found: error

  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: py
        run: |
          pip install -e ".[dev]" || pip install -e .
          pip install pytest

      - name: Run Python tests
        working-directory: py
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          START_TIME=$(date +%s)
          pytest -v
          EXIT_CODE=$?
          END_TIME=$(date +%s)
          DURATION=$(( (END_TIME - START_TIME) * 1000 ))
          if [ "$EXIT_CODE" -eq 0 ]; then
            STATUS="passing"
            ERROR="null"
          else
            STATUS="failing"
            ERROR="\"Tests failed\""
          fi
          cat > "$GITHUB_WORKSPACE/py-algochat.json" << EOF
          {
            "implementationId": "py-algochat",
            "status": "$STATUS",
            "duration": $DURATION,
            "error": $ERROR,
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "$CANDIDATE_SHA"
          }
          EOF
          cat "$GITHUB_WORKSPACE/py-algochat.json"
          exit "$EXIT_CODE"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: py-algochat-result
          path: py-algochat.json
          if-no-files-found: error

  test-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        working-directory: rs
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          START_TIME=$(date +%s)
          cargo test
          EXIT_CODE=$?
          END_TIME=$(date +%s)
          DURATION=$(( (END_TIME - START_TIME) * 1000 ))
          if [ "$EXIT_CODE" -eq 0 ]; then
            STATUS="passing"
            ERROR="null"
          else
            STATUS="failing"
            ERROR="\"Tests failed\""
          fi
          cat > "$GITHUB_WORKSPACE/rs-algochat.json" << EOF
          {
            "implementationId": "rs-algochat",
            "status": "$STATUS",
            "duration": $DURATION,
            "error": $ERROR,
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "$CANDIDATE_SHA"
          }
          EOF
          cat "$GITHUB_WORKSPACE/rs-algochat.json"
          exit "$EXIT_CODE"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rs-algochat-result
          path: rs-algochat.json
          if-no-files-found: error

  test-kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.11
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Run Kotlin tests
        working-directory: kt
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          START_TIME=$(date +%s)
          ./gradlew test --console=plain
          EXIT_CODE=$?
          END_TIME=$(date +%s)
          DURATION=$(( (END_TIME - START_TIME) * 1000 ))
          if [ "$EXIT_CODE" -eq 0 ]; then
            STATUS="passing"
            ERROR="null"
          else
            STATUS="failing"
            ERROR="\"Tests failed\""
          fi
          cat > "$GITHUB_WORKSPACE/kt-algochat.json" << EOF
          {
            "implementationId": "kt-algochat",
            "status": "$STATUS",
            "duration": $DURATION,
            "error": $ERROR,
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "$CANDIDATE_SHA"
          }
          EOF
          cat "$GITHUB_WORKSPACE/kt-algochat.json"
          exit "$EXIT_CODE"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kt-algochat-result
          path: kt-algochat.json
          if-no-files-found: error

  test-go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Run Go tests
        working-directory: go
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          START_TIME=$(date +%s)
          go test ./...
          EXIT_CODE=$?
          END_TIME=$(date +%s)
          DURATION=$(( (END_TIME - START_TIME) * 1000 ))
          if [ "$EXIT_CODE" -eq 0 ]; then
            STATUS="passing"
            ERROR="null"
          else
            STATUS="failing"
            ERROR="\"Tests failed\""
          fi
          cat > "$GITHUB_WORKSPACE/go-algochat.json" << EOF
          {
            "implementationId": "go-algochat",
            "status": "$STATUS",
            "duration": $DURATION,
            "error": $ERROR,
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "$CANDIDATE_SHA"
          }
          EOF
          cat "$GITHUB_WORKSPACE/go-algochat.json"
          exit "$EXIT_CODE"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-algochat-result
          path: go-algochat.json
          if-no-files-found: error

  generate-status:
    needs: [test-swift, test-typescript, test-python, test-rust, test-kotlin, test-go]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout protocol repo
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*-result"
          merge-multiple: true

      - name: Organize results
        run: |
          mkdir -p test-results badges
          find artifacts -name '*.json' -exec cp {} test-results/ \;
          echo "=== Test Results ==="
          cat test-results/*.json

      - name: Generate status page
        run: bun scripts/generate-status.ts --candidate-sha "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Upload status artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-page
          path: |
            status.html
            badges/

  deploy:
    needs: generate-status
    if: always() && needs.generate-status.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download status page
        uses: actions/download-artifact@v4
        with:
          name: status-page
          path: ./

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
