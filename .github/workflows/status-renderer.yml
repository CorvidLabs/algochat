name: Status renderer

# Cheap regressions for the dashboard renderer. A change to the renderer, its
# tests, or the status workflow runs them. A README edit does not start this
# job or the language matrix.
on:
  pull_request:
    paths:
      - "scripts/generate-status.ts"
      - "scripts/generate-status.test.ts"
      - ".github/workflows/status.yml"
      - ".github/workflows/status-renderer.yml"
  push:
    branches: [main]
    paths:
      - "scripts/generate-status.ts"
      - "scripts/generate-status.test.ts"
      - ".github/workflows/status.yml"
      - ".github/workflows/status-renderer.yml"

permissions:
  contents: read

jobs:
  # Runs first. Every other job needs it, so a pull request with any open SpecSync
  # change under .specsync/changes/ runs nothing else until the change is archived.
  archive-gate:
    name: Archive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # The archive gate inputs are newer than v6.1.1, which ignores them.
      - uses: CorvidLabs/spec-sync@106aaa43d0bcf049f19b173ddb63815a25c3f931 # main, archive gate (#832)
        with:
          archive-gate-only: 'true'
  test:
    needs: archive-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@v2
      - run: bun test scripts/generate-status.test.ts
