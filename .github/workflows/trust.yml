name: trust

on:
  pull_request:
    paths:
      - "scripts/release/**"
      - "specs/release/**"
      - "docs/RELEASE.md"
      - "fledge.toml"
      - ".github/workflows/release-qualification.yml"
      - "ts/**"
      - "swift/**"
      - "Package.swift"
      - "py/**"
      - "rs/**"
      - "kt/**"
      - "go/**"
      - "PROTOCOL.md"
      - "TEST-VECTORS.md"
      - "SECURITY.md"
      - "IMPLEMENTATION.md"
      - "implementations.json"
      - ".trust.toml"
      - ".specsync/**"
      - ".github/workflows/trust.yml"
  push:
    branches: [main]
    paths:
      - "scripts/release/**"
      - "specs/release/**"
      - "docs/RELEASE.md"
      - "fledge.toml"
      - ".github/workflows/release-qualification.yml"
      - "ts/**"
      - "swift/**"
      - "Package.swift"
      - "py/**"
      - "rs/**"
      - "kt/**"
      - "go/**"
      - "PROTOCOL.md"
      - "TEST-VECTORS.md"
      - "SECURITY.md"
      - "IMPLEMENTATION.md"
      - "implementations.json"
      - ".trust.toml"
      - ".specsync/**"
      - ".github/workflows/trust.yml"

permissions:
  contents: read

jobs:
  # Runs first. Every other job needs it, so a pull request with any open SpecSync
  # change under .specsync/changes/ runs nothing else until the change is archived.
  archive-gate:
    name: Archive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # The archive gate inputs are newer than v6.1.1, which ignores them.
      - uses: CorvidLabs/spec-sync@106aaa43d0bcf049f19b173ddb63815a25c3f931 # main, archive gate (#832)
        with:
          archive-gate-only: 'true'
  trust:
    needs: archive-gate
    runs-on: ubuntu-latest
    outputs:
      atlas_enabled: ${{ steps.trust.outputs['atlas-enabled'] }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: CorvidLabs/trust@dd52a7a90ffbc1d2b1030e37007c18274f3d96bc # v1.2.1
        id: trust

      - name: Render Atlas publication
        if: github.event_name == 'push' && steps.trust.outputs['atlas-enabled'] == 'true'
        uses: CorvidLabs/fledge-plugin-atlas@bfae900492615c6263c5ef431d1326eabb8b0406 # v1.3.1
        with:
          path: .
          output-dir: trust-atlas
          components: coverage langmix treemap sunburst calendar
          version: bfae900492615c6263c5ef431d1326eabb8b0406

      - name: Render interactive Atlas
        if: github.event_name == 'push' && steps.trust.outputs['atlas-enabled'] == 'true'
        run: fledge-atlas . --out trust-atlas/index.html

      - name: Upload Atlas Pages artifact
        if: github.event_name == 'push' && steps.trust.outputs['atlas-enabled'] == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: trust-atlas

  deploy-atlas:
    if: github.event_name == 'push' && needs.trust.outputs.atlas_enabled == 'true'
    needs: trust
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Atlas to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
