name: Kotlin

# Own-tree changes run this lane by itself. Shared protocol, vector, and
# release-script changes run the full matrix from release-qualification.yml.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "kt/**"
      - ".github/workflows/kt.yml"
      - "!**/*.md"
  push:
    branches: [main]
    paths:
      - "kt/**"
      - ".github/workflows/kt.yml"
      - "!**/*.md"

permissions:
  contents: read

jobs:
  # Runs first. Every other job needs it, so a pull request with any open SpecSync
  # change under .specsync/changes/ runs nothing else until the change is archived.
  archive-gate:
    name: Archive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # The archive gate inputs are newer than v6.1.1, which ignores them.
      - uses: CorvidLabs/spec-sync@106aaa43d0bcf049f19b173ddb63815a25c3f931 # main, archive gate (#832)
        with:
          archive-gate-only: 'true'
  test:
    needs: archive-gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"
      - name: Test and qualify package consumer
        run: python3 scripts/release/qualify.py kt "${{ runner.temp }}/qualification-kt"
      - name: Preserve commands and candidate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-kt
          path: ${{ runner.temp }}/qualification-kt/
          if-no-files-found: error
