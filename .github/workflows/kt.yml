name: Kotlin

# Called by release-qualification so every candidate runs all six libraries.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"
      - name: Test and qualify package consumer
        run: python3 scripts/release/qualify.py kt "${{ runner.temp }}/qualification-kt"
      - name: Preserve commands and candidate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-kt
          path: ${{ runner.temp }}/qualification-kt/
          if-no-files-found: error
