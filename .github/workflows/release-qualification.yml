name: Release qualification

# Language trees trigger their own workflows. This matrix runs only when a
# change can affect every library: the protocol, vectors, or release scripts.
# A README, docs, or intent-only change does not start it.
on:
  pull_request:
    paths:
      - "PROTOCOL.md"
      - "TEST-VECTORS.md"
      - "vectors/**"
      - "scripts/release/**"
      - ".github/workflows/release-qualification.yml"
  push:
    branches: [main]
    paths:
      - "PROTOCOL.md"
      - "TEST-VECTORS.md"
      - "vectors/**"
      - "scripts/release/**"
      - ".github/workflows/release-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs first. Every other job needs it, so a pull request with any open SpecSync
  # change under .specsync/changes/ runs nothing else until the change is archived.
  archive-gate:
    name: Archive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # The archive gate inputs are newer than v6.1.1, which ignores them.
      - uses: CorvidLabs/spec-sync@106aaa43d0bcf049f19b173ddb63815a25c3f931 # main, archive gate (#832)
        with:
          archive-gate-only: 'true'
  checks:
    needs: archive-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/release -v
  ts:
    needs: archive-gate
    uses: ./.github/workflows/ts.yml
  py:
    needs: archive-gate
    uses: ./.github/workflows/py.yml
  go:
    needs: archive-gate
    uses: ./.github/workflows/go.yml
  kt:
    needs: archive-gate
    uses: ./.github/workflows/kt.yml
  rs:
    needs: archive-gate
    uses: ./.github/workflows/rs.yml
  swift:
    needs: archive-gate
    # One Linux receipt: swift.yml also has this lane for direct Swift runs.
    uses: ./.github/workflows/swift.yml
    with:
      skip_linux: true
  swift-linux:
    needs: archive-gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # Ubuntu runner supplies Swift; qualify.py records the actual version.
      - run: python3 scripts/release/qualify.py swift-linux "${{ runner.temp }}/qualification-swift-linux"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-swift-linux
          path: ${{ runner.temp }}/qualification-swift-linux/
          if-no-files-found: error
  complete:
    if: always()
    needs: [archive-gate, checks, ts, py, rs, kt, go, swift, swift-linux]
    runs-on: ubuntu-latest
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Reject failed or skipped jobs
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['JOB_RESULTS'])
          assert all(job['result'] == 'success' for job in jobs.values()), jobs
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: qualification-*
          path: ${{ runner.temp }}/qualification
      - name: Verify exact candidate evidence and every artifact hash
        run: python3 scripts/release/evidence.py "${{ runner.temp }}/qualification" "$CANDIDATE_SHA"
