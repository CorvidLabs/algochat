name: Go

on:
  pull_request:
    paths:
      - "go/**"
      - ".github/workflows/go.yml"
  push:
    branches: [main]
    paths:
      - "go/**"
      - ".github/workflows/go.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go test ./...
