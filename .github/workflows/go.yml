name: Go

# Own-tree changes run this lane by itself. Shared protocol, vector, and
# release-script changes run the full matrix from release-qualification.yml.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "go/**"
      - ".github/workflows/go.yml"
      - "!**/*.md"
  push:
    branches: [main]
    paths:
      - "go/**"
      - ".github/workflows/go.yml"
      - "!**/*.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Test and qualify package consumer
        run: python3 scripts/release/qualify.py go "${{ runner.temp }}/qualification-go"
      - name: Preserve commands and candidate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-go
          path: ${{ runner.temp }}/qualification-go/
          if-no-files-found: error
