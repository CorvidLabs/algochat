name: TypeScript

# Own-tree changes run this lane by itself. Shared protocol, vector, and
# release-script changes run the full matrix from release-qualification.yml.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "ts/**"
      - ".github/workflows/ts.yml"
      - "!**/*.md"
  push:
    branches: [main]
    paths:
      - "ts/**"
      - ".github/workflows/ts.yml"
      - "!**/*.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test and qualify package consumer
        run: python3 scripts/release/qualify.py ts "${{ runner.temp }}/qualification-ts"
      - name: Preserve commands and candidate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-ts
          path: ${{ runner.temp }}/qualification-ts/
          if-no-files-found: error
