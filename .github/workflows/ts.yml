name: TypeScript

on:
  pull_request:
    paths:
      - "ts/**"
      - ".github/workflows/ts.yml"
  push:
    branches: [main]
    paths:
      - "ts/**"
      - ".github/workflows/ts.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
