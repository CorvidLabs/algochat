name: Swift

on:
  pull_request:
    paths:
      - "swift/**"
      - ".github/workflows/swift.yml"
  push:
    branches: [main]
    paths:
      - "swift/**"
      - ".github/workflows/swift.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: swift
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: swift test
