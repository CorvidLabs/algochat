name: Swift

# Own-tree changes run this lane by itself. Shared protocol, vector, and
# release-script changes run the full matrix from release-qualification.yml.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "swift/**"
      - "Package.swift"
      - "Package.resolved"
      - ".github/workflows/swift.yml"
      - "!**/*.md"
  push:
    branches: [main]
    paths:
      - "swift/**"
      - "Package.swift"
      - "Package.resolved"
      - ".github/workflows/swift.yml"
      - "!**/*.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Test and qualify package consumer
        run: python3 scripts/release/qualify.py swift "${{ runner.temp }}/qualification-swift"
      - name: Preserve commands and candidate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-swift
          path: ${{ runner.temp }}/qualification-swift/
          if-no-files-found: error
  linux:
    # The full matrix already runs this lane. Skip it on workflow_call so a
    # shared-file pull request does not qualify Swift Linux twice.
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Test and qualify the Linux package consumer
        run: python3 scripts/release/qualify.py swift-linux "${{ runner.temp }}/qualification-swift-linux"
      - name: Preserve commands and candidate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-swift-linux
          path: ${{ runner.temp }}/qualification-swift-linux/
          if-no-files-found: error
