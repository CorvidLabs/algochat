name: Python

on:
  pull_request:
    paths:
      - "py/**"
      - ".github/workflows/py.yml"
  push:
    branches: [main]
    paths:
      - "py/**"
      - ".github/workflows/py.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest
