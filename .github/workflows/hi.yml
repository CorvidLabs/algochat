name: Human intent

on:
  pull_request:
    paths:
      - "hi/**"
      - ".github/workflows/hi.yml"
  push:
    branches: [main]
    paths:
      - "hi/**"
      - ".github/workflows/hi.yml"

permissions:
  contents: read

jobs:
  # Runs first. Every other job needs it, so a pull request with any open SpecSync
  # change under .specsync/changes/ runs nothing else until the change is archived.
  archive-gate:
    name: Archive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # The archive gate inputs are newer than v6.1.1, which ignores them.
      - uses: CorvidLabs/spec-sync@106aaa43d0bcf049f19b173ddb63815a25c3f931 # main, archive gate (#832)
        with:
          archive-gate-only: 'true'
  hi:
    needs: archive-gate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: hi check
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            aarch64|arm64) asset=hi-aarch64-unknown-linux-gnu.tar.gz ;;
            x86_64) asset=hi-x86_64-unknown-linux-gnu.tar.gz ;;
            *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL -o /tmp/hi.tgz "https://github.com/CorvidLabs/hi/releases/download/v0.8.0/${asset}"
          tar -xzf /tmp/hi.tgz -C /tmp hi
          /tmp/hi check
