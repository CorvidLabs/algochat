<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>swift-algochat architecture</title>
    <link rel="icon" href="../favicon.ico">
    <meta name="description" content="High-level design of swift-algochat: package targets, the AlgoChat protocol, key flows, data, deployment and trust model.">
    <style>
        :root {
            color-scheme: light;
            --bg: #ffffff;
            --fg: #1f2328;
            --muted: #59636e;
            --border: #d1d9e0;
            --surface: #f6f8fa;
            --link: #0969da;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                color-scheme: dark;
                --bg: #0d1117;
                --fg: #e6edf3;
                --muted: #9198a1;
                --border: #3d444d;
                --surface: #151b23;
                --link: #4493f8;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
        }
        a { color: var(--link); }
        a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
        .skip { position: absolute; left: -9999px; }
        .skip:focus { left: 16px; top: 8px; background: var(--bg); padding: 4px 8px; }
        header, main, footer { max-width: 980px; margin: 0 auto; padding: 0 16px; }
        header { border-bottom: 1px solid var(--border); padding-top: 12px; padding-bottom: 12px; }
        header nav { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 14px; }
        footer { border-top: 1px solid var(--border); color: var(--muted); font-size: 14px; padding-top: 16px; padding-bottom: 32px; margin-top: 48px; }
        h1, h2, h3 { line-height: 1.25; }
        h2 { border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-top: 40px; }
        code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 85%; }
        :not(pre) > code { background: var(--surface); border-radius: 6px; padding: 2px 5px; }
        pre { background: var(--surface); border-radius: 6px; padding: 16px; overflow-x: auto; }
        /* Diagrams always sit on a light card so the neutral theme keeps AA contrast in dark mode. */
        pre.mermaid { background: #ffffff; color: #1f2328; border: 1px solid var(--border); text-align: center; }
        pre.mermaid svg { max-width: 100%; height: auto; }
        .table-scroll { overflow-x: auto; margin: 16px 0; }
        table { border-collapse: collapse; min-width: 100%; }
        th, td { border: 1px solid var(--border); padding: 6px 12px; text-align: left; vertical-align: top; }
        th { background: var(--surface); }
        blockquote { margin: 0; padding: 0 16px; border-left: 4px solid var(--border); color: var(--muted); }
    </style>
</head>
<body>
    <a class="skip" href="#content">Skip to content</a>
    <header>
        <nav aria-label="Documentation">
            <a href="../documentation/algochat/">API reference</a>
            <a href="https://github.com/CorvidLabs/swift-algochat">Source on GitHub</a>
            <a href="https://github.com/CorvidLabs/swift-algochat/blob/main/docs/HLD.md">This page as Markdown</a>
            <a href="https://github.com/CorvidLabs/protocol-algochat">Protocol specification</a>
        </nav>
    </header>
    <main id="content">
<!-- HLD -->
    </main>
    <footer>
        Generated from <a href="https://github.com/CorvidLabs/swift-algochat/blob/main/docs/HLD.md">docs/HLD.md</a>
        by the documentation workflow. Diagrams are drawn in the browser with Mermaid.
    </footer>
    <script type="module">
        import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
        mermaid.initialize({ startOnLoad: false, theme: "neutral", securityLevel: "strict" });
        await mermaid.run({ querySelector: "pre.mermaid" });
    </script>
</body>
</html>
